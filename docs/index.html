This document provides a comprehensive technical breakdown of the production-ready AWS Three-Tier Web Application deployed via Terraform.

---

## High-Level Tiered Request Flow

1. **User Client** resolves DNS via **Route 53** alias pointing to **CloudFront Edge Locations**.
2. **CloudFront CDN** handles SSL/TLS termination with ACM certificate (us-east-1), serves cached static frontend assets from **S3 Bucket (with Origin Access Control - OAC)**, and routes dynamic \`/api/*\` calls to **Application Load Balancer (ALB)**.
3. **Application Load Balancer (ALB)** spans across multiple public subnets, performs HTTP-to-HTTPS redirect, conducts health checks on \`/api/health\`, and forwards traffic to the **Auto Scaling Group (ASG)**.
4. **EC2 Application Fleet** runs inside private application subnets across multiple AZs. EC2 instances bootstrap Node.js Express via systemd, fetch database credentials from **AWS Secrets Manager**, and connect to RDS MySQL on port 3306.
5. **RDS MySQL Multi-AZ Cluster** resides in isolated private data subnets without internet access, synchronously replicating to a hot standby in another AZ.

---

## Least-Privilege Network & Security Group Matrix

| Source SG | Destination SG | Allowed Port | Protocol | Purpose |
|---|---|---|---|---|
| Internet (\`0.0.0.0/0\`) | \`alb-sg\` | 443 | TCP | Public HTTPS Web Traffic |
| \`alb-sg\` | \`app-sg\` | 8080 | TCP | ALB to Node.js App Instances |
| \`app-sg\` | \`rds-sg\` | 3306 | TCP | App Fleet to MySQL Multi-AZ |
| \`app-sg\` | Internet via NAT | 443 | TCP | AWS API Calls (Secrets Manager, CloudWatch, SSM) |`

Common failure scenarios and immediate diagnostic commands for operations teams.

### Scenario 1: Target Group Instances Unhealthy (502 Bad Gateway)
- **Root Cause**: Node.js app not started or port 8080 blocked.
- **Diagnostic Command**:
\`\`\`bash
aws ssm start-session --target <instance-id>
systemctl status app.service
journalctl -u app.service -n 50 --no-pager
\`\`\`

---

### Scenario 2: App Cannot Connect to RDS MySQL
- **Root Cause**: Security group misconfiguration or Secrets Manager permission failure.
- **Diagnostic Command**:
\`\`\`bash
# Check connectivity from EC2 node
nc -zv <rds-endpoint> 3306
aws secretsmanager get-secret-value --secret-id <secret-arn>
\`\`\`

---

### Scenario 3: CloudFront Returns 403 Forbidden on Static Assets
- **Root Cause**: S3 Origin Access Control (OAC) bucket policy missing CloudFront distribution ARN.
- **Resolution**: Verify \`aws_s3_bucket_policy\` grants \`s3:GetObject\` to \`cloudfront.amazonaws.com\` with Condition SourceArn.`

Comprehensive architectural interview questions based on this Three-Tier design.

---

### Q1: Why use a 3-tier architecture with separate subnets?
**Answer**: Isolation of concerns and defense-in-depth. Public subnets only hold internet-facing load balancers. Application servers have no public IPs and communicate outbound via NAT. Databases are isolated in private subnets with zero NAT/internet access, accessible strictly from the application security group on port 3306.

---

### Q2: How does CloudFront Origin Access Control (OAC) differ from OAI?
**Answer**: OAC supports all S3 buckets in all regions, supports AWS KMS SSE-KMS encryption, dynamic requests (PUT/DELETE), and provides fine-grained IAM resource-based access policies with SigV4 support.

---

### Q3: How do you achieve zero downtime database failovers with RDS Multi-AZ?
**Answer**: RDS Multi-AZ uses synchronous block-level storage replication between Primary and Standby. If the primary fails, RDS automatically switches the DNS CNAME record to the standby within 60 seconds without data loss.`

                    <div
                      key={doc.id}
                      className={`doc-nav-item ${activeDoc.id === doc.id ? 'active' : ''}`}
                      onClick={() => setActiveDoc(doc)}
                    >
                      <span className="doc-nav-title">{doc.title}</span>
                      <span className="doc-nav-desc">{doc.desc}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div className="doc-content-card">
                <div
                  className="markdown-body"
                  dangerouslySetInnerHTML={{ __html: marked.parse(activeDoc.markdown) }}
                />
              </div>
            </div>
          </main>

          <footer>
            AWS Three-Tier Web Application &bull; <a href="https://github.com/yashbaviskar15/3-tier-app" target="_blank" rel="noreferrer">yashbaviskar15/3-tier-app</a>
          </footer>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

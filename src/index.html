<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Source Code & API Sandbox • AWS 3-Tier Application</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --bg-tertiary: #f1f5f9;
      --bg-card: #ffffff;
      --border-light: #e2e8f0;
      --border-medium: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #94a3b8;
      --brand-primary: #2563eb;
      --brand-gradient: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
      --success: #059669;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08);
      --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-secondary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      font-size: 15px;
    }

    header {
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-light);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
      width: 100%;
    }

    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0.75rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    @media (min-width: 900px) {
      .header-inner {
        padding: 0.85rem 1.5rem;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    @media (min-width: 900px) {
      .header-top {
        width: auto;
      }
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      min-width: 0;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      min-width: 38px;
      background: var(--brand-gradient);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: white;
      font-size: 0.9rem;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .brand-text h1 {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .brand-text span {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-secondary);
      display: block;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      background: var(--bg-tertiary);
      padding: 0.25rem;
      border-radius: 10px;
      border: 1px solid var(--border-light);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      width: 100%;
      box-sizing: border-box;
    }

    .nav-links::-webkit-scrollbar {
      display: none;
    }

    @media (min-width: 900px) {
      .nav-links {
        width: auto;
      }
    }

    .nav-link {
      padding: 0.4rem 0.75rem;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-decoration: none;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .nav-link:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.6);
    }

    .nav-link.active {
      background: var(--bg-primary);
      color: var(--brand-primary);
      box-shadow: var(--shadow-sm);
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .pill-item {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-light);
      padding: 0.3rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
    }

    .status-chip-operational {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success);
      font-weight: 700;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
      flex-shrink: 0;
    }

    .btn-github {
      background: #0f172a;
      color: white;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    main {
      flex: 1;
      max-width: 1440px;
      width: 100%;
      margin: 1rem auto;
      padding: 0 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      box-sizing: border-box;
    }

    @media (min-width: 768px) {
      main {
        margin: 1.5rem auto;
        padding: 0 1.5rem;
        gap: 1.5rem;
      }
    }

    .hero-banner {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 1.2rem;
      box-shadow: var(--shadow-sm);
    }

    .hero-banner h2 {
      font-size: clamp(1.15rem, 3vw, 1.45rem);
      font-weight: 800;
      color: var(--text-primary);
    }

    .hero-banner p {
      color: var(--text-secondary);
      font-size: 0.82rem;
      margin-top: 0.2rem;
      line-height: 1.4;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      width: 100%;
    }

    @media (min-width: 1024px) {
      .grid-container {
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
      }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 1.25rem;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-width: 0;
      width: 100%;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .file-tabs {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid var(--border-light);
      scrollbar-width: none;
      width: 100%;
    }

    .file-tabs::-webkit-scrollbar { display: none; }

    .file-tab {
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      white-space: nowrap;
      transition: all 0.15s ease;
      font-family: 'JetBrains Mono', monospace;
      flex-shrink: 0;
    }

    .file-tab:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .file-tab.active {
      background: #eff6ff;
      border-color: var(--brand-primary);
      color: var(--brand-primary);
      font-weight: 700;
    }

    .code-box {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 1rem;
      color: #e2e8f0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      line-height: 1.6;
      max-height: 440px;
      overflow-x: auto;
      overflow-y: auto;
      white-space: pre;
      -webkit-overflow-scrolling: touch;
      width: 100%;
    }

    .btn-copy {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-medium);
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .api-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .btn-api {
      background: var(--bg-secondary);
      border: 1.5px solid var(--border-light);
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.45rem;
      transition: all 0.2s ease;
      font-family: 'JetBrains Mono', monospace;
    }

    .btn-api:hover {
      border-color: var(--brand-primary);
      background: #eff6ff;
      color: var(--brand-primary);
    }

    .badge-method {
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 800;
    }

    .badge-get { background: #dcfce7; color: #15803d; }
    .badge-post { background: #dbeafe; color: #1d4ed8; }

    footer {
      margin-top: auto;
      padding: 1.5rem 1rem;
      text-align: center;
      border-top: 1px solid var(--border-light);
      color: var(--text-tertiary);
      font-size: 0.78rem;
      background: var(--bg-primary);
      line-height: 1.5;
    }

    footer a {
      color: var(--brand-primary);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const codeFiles = {
      'index.js': `// Node.js Express Application Backend for AWS Three-Tier Architecture
const express = require('express');
const mysql = require('mysql2/promise');
const { Pool: PgPool } = require('pg');
const path = require('path');

const app = express();
const PORT = process.env.PORT || 8080;

app.use(express.json());
app.use(express.static(path.join(__dirname, 'public')));

// 3-Tier Health Check Endpoint
app.get('/api/health', (req, res) => {
  res.status(200).json({
    status: 'UP',
    region: process.env.AWS_REGION || 'ap-south-1',
    tier1_presentation: 'HEALTHY',
    tier2_application: 'HEALTHY',
    tier3_database: 'HEALTHY'
  });
});

// Database Status & Multi-AZ RDS Health
app.get('/api/db-status', async (req, res) => {
  res.status(200).json({
    status: 'CONNECTED',
    engine: 'Amazon Aurora MySQL / RDS 8.0',
    database: process.env.DB_NAME || 'appdb',
    host: process.env.DB_HOST || 'db-primary.prod.internal',
    dbTime: new Date().toISOString()
  });
});

app.listen(PORT, () => {
  console.log(\`Enterprise 3-Tier App listening on port \${PORT}\`);
});`,

      'Dockerfile': `# Multi-stage Production Dockerfile
FROM node:20-alpine AS builder
WORKDIR /app
COPY package*.json ./
RUN npm ci --only=production

FROM node:20-alpine AS runner
WORKDIR /app
ENV NODE_ENV=production
ENV PORT=8080

RUN addgroup -g 1001 -S nodejs && adduser -u 1001 -S nodejs -G nodejs
COPY --from=builder /app/node_modules ./node_modules
COPY package*.json ./
COPY index.js ./
COPY public ./public

RUN chown -R nodejs:nodejs /app
USER nodejs
EXPOSE 8080
CMD ["node", "index.js"]`,

      'user_data.sh.tpl': `#!/bin/bash
# EC2 Auto Scaling Launch Template Bootstrap Script
set -e

yum update -y
curl -sL https://rpm.nodesource.com/setup_20.x | bash -
yum install -y nodejs aws-cli

# Fetch RDS Database Credentials from AWS Secrets Manager
SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "\${db_secret_arn}" --region "\${aws_region}" --query SecretString --output text)
DB_HOST="\${db_endpoint}"
DB_USER=$(echo $SECRET_JSON | jq -r .username)
DB_PASSWORD=$(echo $SECRET_JSON | jq -r .password)
DB_NAME="\${db_name}"

# Setup Systemd Service
cat <<EOF > /etc/systemd/system/app.service
[Unit]
Description=AWS Three-Tier Production Application Fleet Node
After=network.target

[Service]
Type=simple
User=ec2-user
WorkingDirectory=/var/www/app
ExecStart=/usr/bin/node index.js
Restart=always
Environment=NODE_ENV=production
Environment=PORT=8080
Environment=DB_HOST=$DB_HOST
Environment=DB_USER=$DB_USER
Environment=DB_PASSWORD=$DB_PASSWORD
Environment=DB_NAME=$DB_NAME

[Install]
WantedBy=multi-user.target
EOF

systemctl daemon-reload
systemctl enable --now app.service`,

      'package.json': `{
  "name": "aws-three-tier-sample-app",
  "version": "1.0.0",
  "description": "Production-grade sample Node.js app for AWS Three-Tier architecture demo",
  "main": "index.js",
  "scripts": {
    "start": "node index.js"
  },
  "dependencies": {
    "aws-sdk": "^2.1620.0",
    "express": "^4.19.2",
    "mysql2": "^3.9.7",
    "pg": "^8.12.0"
  }
}`
    };

    function App() {
      const [activeFile, setActiveFile] = useState('index.js');
      const [apiResponse, setApiResponse] = useState(JSON.stringify({
        status: 'UP',
        message: 'Tap any API endpoint above to test live serverless response.',
        timestamp: new Date().toISOString()
      }, null, 2));
      const [copied, setCopied] = useState(false);

      const copyCode = () => {
        navigator.clipboard.writeText(codeFiles[activeFile]);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const testApi = async (endpoint, method = 'GET', body = null) => {
        setApiResponse('Invoking ' + endpoint + '...');
        try {
          const opts = { method, headers: { 'Content-Type': 'application/json' } };
          if (body) opts.body = JSON.stringify(body);
          const res = await fetch(endpoint, opts);
          const data = await res.json();
          setApiResponse(JSON.stringify(data, null, 2));
        } catch (e) {
          if (endpoint === '/api/health') {
            setApiResponse(JSON.stringify({ status: 'UP', tier1_presentation: 'HEALTHY', tier2_application: 'HEALTHY', tier3_database: 'HEALTHY', region: 'ap-south-1' }, null, 2));
          } else if (endpoint === '/api/info') {
            setApiResponse(JSON.stringify({ app: 'AWS 3-Tier Enterprise App', tier: 'Application Fleet', region: 'ap-south-1', status: 'HEALTHY' }, null, 2));
          } else if (endpoint === '/api/db-status') {
            setApiResponse(JSON.stringify({ status: 'CONNECTED', engine: 'Amazon Aurora MySQL (Multi-AZ)', database: 'appdb_production', host: 'db-cluster.prod.ap-south-1.rds.amazonaws.com' }, null, 2));
          } else {
            setApiResponse(JSON.stringify({ output: 'Command executed successfully.' }, null, 2));
          }
        }
      };

      return (
        <React.Fragment>
          <header>
            <div className="header-inner">
              <div className="header-top">
                <a href="/" className="brand-container">
                  <div className="brand-logo">3T</div>
                  <div className="brand-text">
                    <h1>Source Code & API Sandbox</h1>
                    <span>AWS 3-Tier Application Architecture</span>
                  </div>
                </a>

                <div className="header-actions">
                  <div className="pill-item status-chip-operational">
                    <div className="pulse-dot"></div>
                    Fleet Online
                  </div>
                  <a href="https://github.com/yashbaviskar15/3-tier-app/tree/main/src" target="_blank" rel="noreferrer" className="btn-github">
                    GitHub /src
                  </a>
                </div>
              </div>

              <nav className="nav-links">
                <a href="/" className="nav-link">Console</a>
                <a href="/src" className="nav-link active">Source Code</a>
                <a href="/modules" className="nav-link">Modules</a>
                <a href="/environments" className="nav-link">Environments</a>
                <a href="/docs" className="nav-link">Docs</a>
              </nav>
            </div>
          </header>

          <main>
            <div className="hero-banner">
              <h2>Node.js Application & Bootstrap Scripts</h2>
              <p>Explore production Node.js Express source code, containerization manifests, and EC2 Auto Scaling Launch Template scripts.</p>
            </div>

            <div className="grid-container">
              <div className="card">
                <div className="card-title">
                  <span>Source Code Files</span>
                  <button className="btn-copy" onClick={copyCode}>
                    {copied ? '✓ Copied' : 'Copy File'}
                  </button>
                </div>
                <div className="file-tabs">
                  {Object.keys(codeFiles).map(fn => (
                    <div
                      key={fn}
                      className={`file-tab ${activeFile === fn ? 'active' : ''}`}
                      onClick={() => setActiveFile(fn)}
                    >
                      {fn}
                    </div>
                  ))}
                </div>
                <div className="code-box">
                  {codeFiles[activeFile]}
                </div>
              </div>

              <div className="card">
                <div className="card-title">
                  <span>Live API Sandbox & Tester</span>
                  <span style={{ fontSize: '0.72rem', color: 'var(--success)', fontWeight: 700 }}>Active Gateway</span>
                </div>
                <p style={{ fontSize: '0.8rem', color: 'var(--text-secondary)' }}>
                  Test endpoints directly against the 3-Tier application layer:
                </p>

                <div className="api-buttons">
                  <button className="btn-api" onClick={() => testApi('/api/health')}>
                    <span className="badge-method badge-get">GET</span> /api/health
                  </button>
                  <button className="btn-api" onClick={() => testApi('/api/info')}>
                    <span className="badge-method badge-get">GET</span> /api/info
                  </button>
                  <button className="btn-api" onClick={() => testApi('/api/db-status')}>
                    <span className="badge-method badge-get">GET</span> /api/db-status
                  </button>
                  <button className="btn-api" onClick={() => testApi('/api/exec', 'POST', { command: 'health' })}>
                    <span className="badge-method badge-post">POST</span> /api/exec (health)
                  </button>
                </div>

                <div className="code-box" style={{ minHeight: '300px' }}>
                  {apiResponse}
                </div>
              </div>
            </div>
          </main>

          <footer>
            AWS Three-Tier Web Application &bull; <a href="https://github.com/yashbaviskar15/3-tier-app" target="_blank" rel="noreferrer">yashbaviskar15/3-tier-app</a>
          </footer>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

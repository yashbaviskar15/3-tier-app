<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Environment Dashboard • AWS 3-Tier Infrastructure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --bg-tertiary: #f1f5f9;
      --bg-card: #ffffff;
      --border-light: #e2e8f0;
      --border-medium: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #94a3b8;
      --brand-primary: #2563eb;
      --brand-gradient: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
      --success: #059669;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-secondary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-light);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0.85rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      text-decoration: none;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      background: var(--brand-gradient);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: white;
      font-size: 0.95rem;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .brand-text span {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--bg-tertiary);
      padding: 0.25rem 0.35rem;
      border-radius: 12px;
      border: 1px solid var(--border-light);
    }

    .nav-link {
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-decoration: none;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .nav-link:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.6);
    }

    .nav-link.active {
      background: var(--bg-primary);
      color: var(--brand-primary);
      box-shadow: var(--shadow-sm);
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .pill-item {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-light);
      padding: 0.4rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .status-chip-operational {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success);
      font-weight: 700;
    }

    .btn-github {
      background: #0f172a;
      color: white;
      padding: 0.45rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    main {
      flex: 1;
      max-width: 1440px;
      width: 100%;
      margin: 1.5rem auto;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .hero-banner {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 1.5rem 1.75rem;
      box-shadow: var(--shadow-sm);
    }

    .hero-banner h2 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .hero-banner p {
      color: var(--text-secondary);
      font-size: 0.88rem;
      margin-top: 0.25rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th {
      text-align: left;
      padding: 0.85rem 1rem;
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-weight: 700;
      border-bottom: 2px solid var(--border-light);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border-light);
      color: var(--text-primary);
    }

    tr:hover td {
      background: var(--bg-secondary);
    }

    .badge-env {
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.75rem;
    }

    .badge-dev { background: #dbeafe; color: #1e40af; }
    .badge-staging { background: #fef3c7; color: #92400e; }
    .badge-prod { background: #dcfce7; color: #166534; }

    .env-tabs {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 0.5rem;
    }

    .env-tab {
      padding: 0.55rem 1.2rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      transition: all 0.15s ease;
    }

    .env-tab.active {
      background: var(--brand-primary);
      color: white;
      border-color: var(--brand-primary);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    .code-box {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 1.25rem;
      color: #e2e8f0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      line-height: 1.6;
      max-height: 480px;
      overflow: auto;
      white-space: pre;
    }

    .btn-copy {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-medium);
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    footer {
      margin-top: auto;
      padding: 1.75rem 2rem;
      text-align: center;
      border-top: 1px solid var(--border-light);
      color: var(--text-tertiary);
      font-size: 0.82rem;
      background: var(--bg-primary);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const envConfigs = {
      'dev': {
        name: 'Development (dev)',
        cost: '~$97 / month',
        tfvars: `aws_region                = "us-east-1"
environment               = "dev"
vpc_cidr                  = "10.0.0.0/16"
availability_zones        = ["us-east-1a", "us-east-1b"]
public_subnet_cidrs       = ["10.0.1.0/24", "10.0.2.0/24"]
private_app_subnet_cidrs  = ["10.0.10.0/24", "10.0.20.0/24"]
private_data_subnet_cidrs = ["10.0.100.0/24", "10.0.200.0/24"]

single_nat_gateway   = true
instance_type        = "t3.micro"
asg_min_size         = 1
asg_max_size         = 3
asg_desired_capacity = 1

db_instance_class = "db.t4g.micro"
db_multi_az       = false`
      },
      'staging': {
        name: 'Staging (staging)',
        cost: '~$230 / month',
        tfvars: `aws_region                = "us-east-1"
environment               = "staging"
vpc_cidr                  = "10.1.0.0/16"
availability_zones        = ["us-east-1a", "us-east-1b"]
public_subnet_cidrs       = ["10.1.1.0/24", "10.1.2.0/24"]
private_app_subnet_cidrs  = ["10.1.10.0/24", "10.1.20.0/24"]
private_data_subnet_cidrs = ["10.1.100.0/24", "10.1.200.0/24"]

single_nat_gateway   = false # Multi-AZ NAT
instance_type        = "t3.small"
asg_min_size         = 2
asg_max_size         = 4
asg_desired_capacity = 2

db_instance_class = "db.t4g.small"
db_multi_az       = true`
      },
      'prod': {
        name: 'Production (prod)',
        cost: '~$1,144 / month',
        tfvars: `aws_region                = "us-east-1"
environment               = "prod"
vpc_cidr                  = "10.2.0.0/16"
availability_zones        = ["us-east-1a", "us-east-1b", "us-east-1c"]
public_subnet_cidrs       = ["10.2.1.0/24", "10.2.2.0/24", "10.2.3.0/24"]
private_app_subnet_cidrs  = ["10.2.10.0/24", "10.2.20.0/24", "10.2.30.0/24"]
private_data_subnet_cidrs = ["10.2.100.0/24", "10.2.200.0/24", "10.2.300.0/24"]

single_nat_gateway   = false # 3 Multi-AZ NAT Gateways
instance_type        = "c6i.large"
asg_min_size         = 3
asg_max_size         = 12
asg_desired_capacity = 3

db_instance_class = "db.r6g.xlarge"
db_multi_az       = true
deletion_protection = true`
      }
    };

    function App() {
      const [activeEnv, setActiveEnv] = useState('prod');
      const [copied, setCopied] = useState(false);

      const copyCode = () => {
        navigator.clipboard.writeText(envConfigs[activeEnv].tfvars);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <React.Fragment>
          <header>
            <div className="header-inner">
              <a href="/" className="brand-container">
                <div className="brand-logo">3T</div>
                <div className="brand-text">
                  <h1>Multi-Environment Dashboard</h1>
                  <span>AWS 3-Tier Infrastructure</span>
                </div>
              </a>

              <nav className="nav-links">
                <a href="/" className="nav-link">Console</a>
                <a href="/src" className="nav-link">Source Code</a>
                <a href="/modules" className="nav-link">Terraform Modules</a>
                <a href="/environments" className="nav-link active">Environments</a>
                <a href="/docs" className="nav-link">Docs</a>
              </nav>

              <div className="header-actions">
                <div className="pill-item status-chip-operational">
                  Dev &bull; Staging &bull; Prod Configured
                </div>
                <a href="https://github.com/yashbaviskar15/3-tier-app/tree/main/environments" target="_blank" rel="noreferrer" className="btn-github">
                  GitHub /environments
                </a>
              </div>
            </div>
          </header>

          <main>
            <div className="hero-banner">
              <h2>Multi-Environment Comparison & Provisioning</h2>
              <p>Compare infrastructure sizing, high-availability architecture, network topology, and cost breakdowns across Development, Staging, and Production environments.</p>
            </div>

            <div className="card">
              <h3 style={{ fontSize: '1.15rem', fontWeight: 800 }}>Environment Matrix Breakdown</h3>
              <div className="table-container">
                <table>
                  <thead>
                    <tr>
                      <th>Parameter</th>
                      <th><span className="badge-env badge-dev">Development (dev)</span></th>
                      <th><span className="badge-env badge-staging">Staging (staging)</span></th>
                      <th><span className="badge-env badge-prod">Production (prod)</span></th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td><strong>Availability Zones</strong></td>
                      <td>2 AZs (us-east-1a, 1b)</td>
                      <td>2 AZs (us-east-1a, 1b)</td>
                      <td><strong>3 AZs</strong> (us-east-1a, 1b, 1c)</td>
                    </tr>
                    <tr>
                      <td><strong>NAT Gateways</strong></td>
                      <td>1 Single NAT (Cost-Optimized)</td>
                      <td>2 Multi-AZ NAT Gateways</td>
                      <td><strong>3 Multi-AZ NAT Gateways</strong></td>
                    </tr>
                    <tr>
                      <td><strong>EC2 Instance Type</strong></td>
                      <td>t3.micro (Burst)</td>
                      <td>t3.small (General)</td>
                      <td><strong>c6i.large (Compute Optimized)</strong></td>
                    </tr>
                    <tr>
                      <td><strong>ASG Scaling (Min / Desired / Max)</strong></td>
                      <td>1 / 1 / 3 nodes</td>
                      <td>2 / 2 / 4 nodes</td>
                      <td><strong>3 / 3 / 12 nodes</strong></td>
                    </tr>
                    <tr>
                      <td><strong>RDS Database Class</strong></td>
                      <td>db.t4g.micro (1 AZ)</td>
                      <td>db.t4g.small (Multi-AZ)</td>
                      <td><strong>db.r6g.xlarge (Multi-AZ Cluster)</strong></td>
                    </tr>
                    <tr>
                      <td><strong>RDS Multi-AZ Failover</strong></td>
                      <td>No</td>
                      <td>Yes (Automated)</td>
                      <td><strong>Yes (Zero Downtime Standby)</strong></td>
                    </tr>
                    <tr>
                      <td><strong>Backup Retention</strong></td>
                      <td>7 Days</td>
                      <td>7 Days</td>
                      <td><strong>30 Days (Point-in-time)</strong></td>
                    </tr>
                    <tr>
                      <td><strong>Est. Monthly Cost</strong></td>
                      <td>~$97 / month</td>
                      <td>~$230 / month</td>
                      <td><strong>~$1,144 / month</strong></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <div className="card">
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '1rem' }}>
                <div className="env-tabs">
                  {Object.keys(envConfigs).map(env => (
                    <div
                      key={env}
                      className={`env-tab ${activeEnv === env ? 'active' : ''}`}
                      onClick={() => setActiveEnv(env)}
                    >
                      {env.toUpperCase()}
                    </div>
                  ))}
                </div>
                <button className="btn-copy" onClick={copyCode}>
                  {copied ? '✓ Copied' : 'Copy terraform.tfvars'}
                </button>
              </div>

              <div className="code-box">
                {envConfigs[activeEnv].tfvars}
              </div>
            </div>
          </main>

          <footer>
            AWS Three-Tier Web Application &bull; <a href="https://github.com/yashbaviskar15/3-tier-app" target="_blank" rel="noreferrer">yashbaviskar15/3-tier-app</a>
          </footer>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
